name: External Cron Check

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ticket-radar-external-cron
  cancel-in-progress: false

jobs:
  call-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call Ticket Radar cron endpoint
        run: |
          curl --fail --show-error --silent \
            --retry 2 \
            --retry-delay 5 \
            --max-time 55 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$TICKET_RADAR_CRON_URL"
        env:
          CRON_SECRET: ${{ secrets.TICKET_RADAR_CRON_SECRET }}
          TICKET_RADAR_CRON_URL: ${{ secrets.TICKET_RADAR_CRON_URL }}
